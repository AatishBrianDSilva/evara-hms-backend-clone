---
openapi: 3.0.0
info:
  title: Evara HMS API
  description: |
    Comprehensive APIs for the HMS (Health Management System) focused on fertility treatments and IVF procedures. This API requires JWT authentication for all endpoints. Access to specific operations is based on user roles, including Admin, Doctor, and Patient roles.
  contact:
    email: ratandeep@growthverse.in
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/RatandeepArunkumar/Evara/1.0.0
  description: SwaggerHub API Auto Mocking
security:
- BearerAuth: []
tags:
- name: Patient Management
  description: "Operations related to patient registration, management, and information retrieval."
- name: IVF Treatment
  description: "Endpoints for managing IVF treatment cycles, patient monitoring, and treatment outcomes."
- name: Appointment Scheduling
  description: "APIs for scheduling, updating, and canceling appointments."
- name: Billing and Payments
  description: "Manage billing information, insurance claims, and payment processing."
paths:
  /ivf-registration:
    post:
      tags:
      - Patient Management
      summary: Register a Patient for IVF Treatment
      description: "Registers a new patient in the Evara Health Management System and creates a new IVF treatment case. **Required Role:** Admin, Front-Desk"
      operationId: registerIVFPatient
      requestBody:
        description: Details of the patient to be registered for IVF treatment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistrationRequest'
        required: true
      responses:
        "201":
          description: Patient registration and IVF case creation successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: Invalid input provided. Please review the request body and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: A patient case with similar details already exists. Duplicate registration not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PatientRegistrationRequest:
      required:
      - contactInfo
      - patientDOB
      - patientName
      type: object
      properties:
        patientName:
          type: string
          example: Jane Doe
        patientDOB:
          type: string
          format: date
          example: 1980-04-23
        contactInfo:
          $ref: '#/components/schemas/PatientRegistrationRequest_contactInfo'
        medicalHistory:
          type: array
          example:
          - PCOS
          - Endometriosis
          items:
            type: string
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          additionalProperties: true
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          $ref: '#/components/schemas/ErrorResponse_error'
    PatientRegistrationRequest_contactInfo:
      type: object
      properties:
        email:
          type: string
          example: jane.doe@example.com
        phone:
          type: string
          example: +1234567890
    ErrorResponse_error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      description: |
        JWT authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}". All endpoints require authentication and are subject to role-based access control.
      scheme: bearer
      bearerFormat: JWT
